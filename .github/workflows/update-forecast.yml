name: Automated Dekadal Forecast

on:
  schedule:
    # WFP/HDX publishes on 1st/3rd/6th/11th/13th/16th/21st/23rd/26th, and HDX metadata
    # says 'every two weeks'. Daily is cheapest and cannot miss an update;
    # the pipeline skips download if CKAN last_modified is unchanged.
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write  # Required for auto-commit

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas scikit-learn xgboost joblib numpy

      - name: Run forecast pipeline
        run: python scripts/update_forecast.py

      - name: Commit and push updated forecast
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add utils/latest_forecast.json utils/bwa-rainfall-engineered.csv
          git diff --staged --quiet || git commit -m "Auto-update: dekadal forecast ($(date +%Y-%m-%d))"
          git push

      - name: Report status
        run: echo "✅ Forecast pipeline completed successfully"
