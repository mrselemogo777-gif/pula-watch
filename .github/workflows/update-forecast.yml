name: Automated Dekadal Forecast

on:
  schedule:
    # Runs at 08:00 UTC on the 2nd, 12th, and 22nd of every month
    # (one day after CHIRPS/HDX typically publishes new data)
    - cron: '0 8 2,12,22 * *'
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write  # Required for auto-commit

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas scikit-learn xgboost joblib numpy

      - name: Run forecast pipeline
        run: python scripts/update_forecast.py

      - name: Commit and push updated forecast
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add utils/latest_forecast.json utils/bwa-rainfall-engineered.csv
          git diff --staged --quiet || git commit -m "Auto-update: dekadal forecast ($(date +%Y-%m-%d))"
          git push

      - name: Report status
        run: echo "✅ Forecast pipeline completed successfully"
